# Local dev stack only — production deploys packages/backend and packages/web
# directly via ECS/CloudFront (see terraform/ and .github/workflows/deploy.yml),
# not this file. restart: "no" everywhere is intentional so a crashed
# container surfaces immediately in the terminal instead of restart-looping.
version: "3.9"

services:
  db:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-anote}
      MYSQL_DATABASE: ${DB_NAME:-anote}
      MYSQL_USER: ${DB_USER:-anote}
      MYSQL_PASSWORD: ${DB_PASSWORD:-anote}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-anote}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6379:6379"

  tika:
    image: apache/tika:latest
    restart: "no"
    ports:
      - "9998:9998"

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "5000:5000"
    environment: &backend_env
      APP_ENV: ${APP_ENV:-local}
      IS_PROD: ${IS_PROD:-false}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-anote}
      DB_USER: ${DB_USER:-anote}
      DB_PASSWORD: ${DB_PASSWORD:-anote}
      REDIS_URL: redis://redis:6379
      TIKA_URL: http://tika:9998
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      PROVIDER_KEY_ENCRYPTION_KEY: ${PROVIDER_KEY_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:5000/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      COWORKER_MODEL: ${COWORKER_MODEL:-claude-opus-5-5}
      COWORKER_EFFORT: ${COWORKER_EFFORT:-medium}
      COWORKER_OFFLINE: ${COWORKER_OFFLINE:-0}
      GOOGLE_COWORKER_REDIRECT_URI: ${GOOGLE_COWORKER_REDIRECT_URI:-http://localhost:5000/api/coworker/connections/google/callback}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      VOICEPRINT_BACKEND: ${VOICEPRINT_BACKEND:-local}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      RECALL_API_KEY: ${RECALL_API_KEY:-}
      RECALL_API_BASE: ${RECALL_API_BASE:-https://us-east-1.recall.ai/api/v1}
      TAVUS_API_KEY: ${TAVUS_API_KEY:-}
      TAVUS_REPLICA_ID: ${TAVUS_REPLICA_ID:-}
      TWIN_FOLDER: /app/twin
      TWIN_S3_BUCKET: ${TWIN_S3_BUCKET:-}
      TWIN_S3_SSE: ${TWIN_S3_SSE:-aws:kms}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      COWORKER_ENFORCE_PLANS: ${COWORKER_ENFORCE_PLANS:-0}
      STRIPE_PRICE_COWORKER: ${STRIPE_PRICE_COWORKER:-}
      STRIPE_PRICE_COWORKER_CALLS: ${STRIPE_PRICE_COWORKER_CALLS:-}
      STRIPE_PRICE_COWORKER_TEAM: ${STRIPE_PRICE_COWORKER_TEAM:-}
      PILOT_SLACK_WEBHOOK_URL: ${PILOT_SLACK_WEBHOOK_URL:-}
      PILOT_BOOKING_URL: ${PILOT_BOOKING_URL:-}
      PILOT_ADMIN_EMAILS: ${PILOT_ADMIN_EMAILS:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-Ourogen <notifications@ourogen.ai>}
      COWORKER_SYNC_MODE: ${COWORKER_SYNC_MODE:-thread}
      SENTRY_DSN: ${SENTRY_DSN:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      COWORKER_RETENTION_DAYS: ${COWORKER_RETENTION_DAYS:-180}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - twin_data:/app/twin

  # Runs every user's coworker loop (responsibilities, scheduled sends) even
  # when nobody has the web app open.
  coworker-worker:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["python", "-m", "coworker.worker", "--interval", "60"]
    # Same settings as the backend: the worker sends email, posts to Slack,
    # and reads twin files.
    environment: *backend_env
    volumes:
      - twin_data:/app/twin
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BACK_END_HOST: http://localhost:5000
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
  twin_data:
