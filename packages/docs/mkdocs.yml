site_name: Ourogen Docs
site_url: https://docs.ourogen.ai
site_description: Unified AI coding assistant and chatbot platform
site_author: Ourogen

repo_name: anote-ai/Panacea
repo_url: https://github.com/anote-ai/Panacea

extra:
  homepage: https://ourogen.ai
  # `extra.alternate` is no longer hand-maintained here — the i18n plugin
  # below (reconfigure_material: true) populates it automatically from the
  # `languages` list, with real per-language URLs and correct hreflang tags.

theme:
  name: material
  custom_dir: overrides
  font: false
  # Three-way palette: System (auto, follows OS) / Light / Dark. No `toggle:`
  # keys here on purpose — Material's own toggle is a single cycling button;
  # we render our own System/Light/Dark dropdown instead (see
  # overrides/partials/header.html), wired to these same hidden radio inputs
  # via plain <label for="__palette_N"> — no custom JS needed.
  # The named primary/accent colors below are just Material's palette-picker
  # keys, not the real colors — docs/stylesheets/extra.css overrides the
  # underlying CSS variables with exact hex values matching the product and
  # landing page (pure white/black neutral grayscale, no accent color).
  # "grey" is the closest built-in key to that, so the two states agree.
  palette:
    - media: "(prefers-color-scheme)"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/ourogen-icon-black.png
  favicon: assets/ourogen-icon-black.png

extra_css:
  - stylesheets/extra.css


plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
        - locale: de
          name: Deutsch
          build: true
        - locale: it
          name: Italiano
          build: true
        - locale: ja
          name: 日本語
          build: true
        - locale: es
          name: Español
          build: true
        - locale: ko
          name: 한국어
          build: true
        - locale: zh
          name: 简体中文
          build: true
        - locale: zh-Hant
          name: 繁體中文
          build: true
        - locale: ru
          name: Русский
          build: true
        - locale: id
          name: Bahasa Indonesia
          build: true
        - locale: pt-BR
          name: Português (BR)
          build: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

